AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege role that lets GitHub Actions on the main branch publish the wedding planner app

Parameters:
  # GitHub issues subjects pinned to immutable owner/repository IDs (owner@id/repo@id), so a re-created repository with the same name is not trusted.
  AllowedSubjects:
    Type: CommaDelimitedList
    Default: 'repo:jigglypop@52653682/wedding@1407457525:ref:refs/heads/main'
  GitHubOidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider for token.actions.githubusercontent.com
  AppStackName:
    Type: String
    Default: wedding-planner
  DistributionId:
    Type: String
    Description: CloudFront distribution of the app stack

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppStackName}-github-deploy'
      Description: Assumed by GitHub Actions to publish the Lambda bundle and website (no infrastructure changes)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref AllowedSubjects
      Policies:
        - PolicyName: PublishWeddingPlanner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
              # No GetFunction/GetFunctionConfiguration: they would return the function's secret environment.
              - Effect: Allow
                Action: lambda:UpdateFunctionCode
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-api'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppStackName}-${AWS::AccountId}-${AWS::Region}-web'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppStackName}-${AWS::AccountId}-${AWS::Region}-web/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppStackName}-${AWS::AccountId}-${AWS::Region}-materials/build-data/*'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
