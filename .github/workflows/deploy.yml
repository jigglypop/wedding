name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  STACK_NAME: wedding-planner
  AWS_ROLE_ARN: arn:aws:iam::960243570517:role/wedding-planner-github-deploy

jobs:
  deploy:
    name: Test, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The licensed planner templates stay out of this public repository; scripts/deploy.ps1 stores them privately.
      - name: Fetch private planner data
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='MaterialsBucket'].OutputValue" --output text)"
          mkdir -p data
          for file in initial-state.json materials.json; do
            aws s3 cp "s3://$bucket/build-data/$file" "data/$file" --only-show-errors
          done

      # Tests and the build run without AWS credentials.
      - run: npm run typecheck && npm test && npm run build
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''

      - name: Publish API and website
        run: bash scripts/deploy-app.sh
